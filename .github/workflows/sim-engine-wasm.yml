name: sim-engine-wasm

# Builds EnergyPlus as a Pyodide side module from source, tests it, and packs @luzechao/sim-engine-wasm.
# Pushing a tag sim-engine-wasm-v<version> (equal to packages/sim-engine-wasm/package.json "version") also
# attaches the tarball to a GitHub Release, installable as
#   npm install https://github.com/luzechao/browser-energy-simulation/releases/download/<tag>/luzechao-sim-engine-wasm-<version>.tgz
# and, when the repository variable NPM_PUBLISH is "true", publishes it to npm.
#
# npm authentication, either:
#  - trusted publishing: on npmjs.com, package settings -> Trusted Publisher -> GitHub Actions, repository
#    luzechao/browser-energy-simulation, workflow sim-engine-wasm.yml (needs the package to exist, so the first
#    version is published with a token or by hand), or
#  - a granular automation token stored as the repository secret NPM_TOKEN.

on:
  push:
    tags: ['sim-engine-wasm-v*']
  workflow_dispatch:

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance and trusted publishing

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14' # build-time code generation; matches Pyodide's CPython minor version

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            emsdk-pyodide
            third_party/pyodide
          key: pyodide-toolchain-${{ hashFiles('scripts/setup-pyodide-toolchain.sh') }}

      - name: Fetch EnergyPlus source, emsdk and Pyodide
        run: bash scripts/setup-pyodide-toolchain.sh

      - name: Build libenergyplusapi.so
        run: bash scripts/configure-ep-pyodide.sh --build

      - name: Stage, build and test the package
        working-directory: packages/sim-engine-wasm
        run: |
          npm ci
          npm run stage
          npm run build
          npm test

      - name: PythonPlugin gate and upstream example sweep
        run: |
          node test/ep_pyodide_plugin_gate.mjs
          node test/ep_pyodide_plugin_sweep.mjs

      - name: Pack
        working-directory: packages/sim-engine-wasm
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: sim-engine-wasm
          path: packages/sim-engine-wasm/*.tgz

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/sim-engine-wasm-v')
        working-directory: packages/sim-engine-wasm
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "sim-engine-wasm-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/sim-engine-wasm-v')
        working-directory: packages/sim-engine-wasm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(ls ./*.tgz)"
          sha="$(sha256sum "$tarball" | cut -d' ' -f1)"
          notes="EnergyPlus version 26.1.0 software as a Pyodide 314 side module, built from source by this workflow (run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}).

          Install: \`npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$tarball")\`

          SHA-256 \`${sha}\`. See packages/sim-engine-wasm/README.md and NOTICE."
          gh release create "${GITHUB_REF_NAME}" "$tarball" --title "@luzechao/sim-engine-wasm ${GITHUB_REF_NAME#sim-engine-wasm-v}" --notes "$notes"

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/sim-engine-wasm-v') && vars.NPM_PUBLISH == 'true'
        working-directory: packages/sim-engine-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --provenance --access public
